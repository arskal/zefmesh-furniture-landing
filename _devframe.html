<!DOCTYPE html><html><head><meta charset="utf-8"><title>devframe</title>
<style>
  body{margin:0;background:#333;display:flex;gap:12px;padding:12px;font:12px system-ui;color:#fff}
  figure{margin:0}
  iframe{border:0;background:#000;display:block}
  figcaption{padding:4px 0}
</style></head><body>
<figure><figcaption>380 x 780</figcaption><iframe id="a" src="/" width="380" height="780"></iframe></figure>
<figure><figcaption>768 x 780</figcaption><iframe id="b" src="/" width="768" height="780"></iframe></figure>
<script>
  window.jump = (y) => { for (const f of [a,b]) f.contentWindow.scrollTo(0,y); };
  window.at = (id, y) => { document.getElementById(id==='a'?'a':'b').contentWindow.scrollTo(0,y); };
  window.goto = (sel) => { for (const f of [a,b]) { const el=f.contentDocument.querySelector(sel); if(el) f.contentWindow.scrollTo(0, el.getBoundingClientRect().top + f.contentWindow.scrollY - 10);} };
</script>
</body></html>
